services:
  client:
    image: node:26-alpine
    user: "1000:1000"
    working_dir: /workspace
    volumes:
      - ./:/workspace
    ports:
      - "5176:5176"
    environment:
      VITE_API_URL: http://localhost:3003
    command: npm run dev --prefix react-app -- --host 0.0.0.0 --port 5176
    depends_on:
      - api

  api:
    image: node:26-alpine
    user: "1000:1000"
    working_dir: /workspace
    volumes:
      - ./:/workspace
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      MONGODB_URI: mongodb://mongo:27017/excursions
    command: npm run start-express
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:latest
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mongo_data:
