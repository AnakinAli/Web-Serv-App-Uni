services:
  client:
    image: node:26-alpine
    user: "1000:1000"
    working_dir: /workspace
    volumes:
      - ./:/workspace
    ports:
      - "5175:5175"
    environment:
      VITE_API_URL: http://localhost:3002/api
    command: npm run dev --prefix react-app -- --host 0.0.0.0 --port 5175
    depends_on:
      - api

  api:
    image: node:26-alpine
    user: "1000:1000"
    working_dir: /workspace
    volumes:
      - ./:/workspace
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: excursions_app
    command: npm run server
    depends_on:
      mongo:
        condition: service_healthy

  json-server:
    image: node:26-alpine
    user: "1000:1000"
    working_dir: /workspace
    volumes:
      - ./:/workspace
    ports:
      - "8002:8002"
    command: npm run json-server
    profiles:
      - json-server

  mongo:
    image: mongo:latest
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mongo_data:
